<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="FantasyTeamHub">
  <!--
    The verdict bars: keep, watch, sell, which also read as an F. Thicker than the app icon's
    so they survive 16px, and recoloured for light browser chrome.
  -->
  <style>
    .bg { fill: #101426; }
    .keep { fill: #05c988; } .watch { fill: #f5b83d; } .sell { fill: #f0566e; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #d5dae6; stroke-width: 4; }
      .keep { fill: #04a672; } .watch { fill: #e09a12; } .sell { fill: #e03a55; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="96" height="96" rx="21" />
  <rect class="keep" x="19" y="19" width="62" height="17" rx="8.5" />
  <rect class="watch" x="19" y="41.5" width="43" height="17" rx="8.5" />
  <rect class="sell" x="19" y="64" width="25" height="17" rx="8.5" />
</svg>
