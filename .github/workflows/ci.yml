name: CI

# Quality gate for anything heading into main. Vercel handles the deploy itself via its
# Git integration; this job exists so a broken build cannot be merged in the first place.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings=0

      # PageProps/LayoutProps are globals Next generates into .next/types and next-env.d.ts,
      # both gitignored — so a clean checkout must generate them before tsc can resolve them.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # The build prerenders pages that read the public FPL API; no secrets required.
          NEXT_TELEMETRY_DISABLED: "1"
